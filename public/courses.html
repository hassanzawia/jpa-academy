<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>الدورات التدريبية | Al-Jawda Pharmacy Academy</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0e7c66" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="header">
  <div class="logo-badge">JPA · Al-Jawda Pharmacy Academy</div>
  <h1>الدورات التدريبية</h1>
  <p class="slogan" id="welcome-user">مرحباً بك</p>
</header>

<main class="container">

  <div class="wallet-bar">
    <div>
      <div class="label">رصيد محفظتك</div>
      <div class="balance" id="wallet-balance">... جارٍ التحميل</div>
    </div>
    <button class="btn btn-outline btn-small" style="background:#fff;" onclick="requestTopUp()">شحن الرصيد</button>
  </div>

  <div class="category-filters" id="category-filters"></div>

  <div class="course-grid" id="course-grid"></div>

</main>

<nav class="bottom-nav">
  <a href="index.html"><span class="nav-icon">🏠</span>الرئيسية</a>
  <a href="login.html"><span class="nav-icon">🔑</span>دخول</a>
  <a href="courses.html" class="active"><span class="nav-icon">📚</span>الدورات</a>
</nav>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/sync.js"></script>
<script src="js/courses-data.js"></script>
<script>
  requireAuth();

  // ⚠️ إصلاح مهم: نعرض بطاقات الدورات فوراً بقيم افتراضية (رصيد 0، بدون اشتراكات)
  // دون انتظار استجابة Firebase، حتى لا تختفي القائمة إن تأخر الاتصال.
  // بمجرد وصول بيانات Firestore الحقيقية عبر listenToWallet، يُعاد رسم كل شيء بالقيم الصحيحة.
  let currentBalance = 0;
  let currentEnrolled = [];
  let activeCategory = "all";

  auth.onAuthStateChanged((user) => {
    if (user) document.getElementById("welcome-user").textContent = "مرحباً، " + user.email;
  });

  // رسم أولي فوري (defense-in-depth) حتى لا تظهر الصفحة فارغة أبداً
  renderCategoryFilters();
  renderCourses();

  // تحديث حي بمجرد جاهزية Firestore
  listenToWallet((balance, enrolled) => {
    currentBalance = balance;
    currentEnrolled = enrolled;
    document.getElementById("wallet-balance").textContent = balance + " د.ل";
    renderCourses();
  });

  function renderCategoryFilters() {
    const container = document.getElementById("category-filters");
    container.innerHTML = "";
    const allChip = document.createElement("button");
    allChip.className = "category-chip active";
    allChip.textContent = "🔎 الكل";
    allChip.onclick = () => selectCategory("all", allChip);
    container.appendChild(allChip);

    COURSE_CATEGORIES.forEach((cat) => {
      const chip = document.createElement("button");
      chip.className = "category-chip";
      chip.textContent = `${cat.icon} ${cat.name}`;
      chip.onclick = () => selectCategory(cat.id, chip);
      container.appendChild(chip);
    });
  }

  function selectCategory(catId, el) {
    activeCategory = catId;
    document.querySelectorAll(".category-chip").forEach((c) => c.classList.remove("active"));
    el.classList.add("active");
    renderCourses();
  }

  function renderCourses() {
    const grid = document.getElementById("course-grid");
    grid.innerHTML = "";
    const list = activeCategory === "all" ? COURSES : getCoursesByCategory(activeCategory);

    list.forEach((course) => {
      const isEnrolled = currentEnrolled.includes(course.id);
      const card = document.createElement("div");
      card.className = "course-card";
      card.innerHTML = `
        <div class="thumb">📖</div>
        <div class="body">
          <div class="instructor">${course.instructor} · ${course.instructorTitle}</div>
          <h3>${course.title}</h3>
          <p class="desc">${course.description}</p>
        </div>
        <div class="footer-row">
          ${isEnrolled
            ? '<span class="enrolled-badge">✅ مشترك</span>'
            : `<span class="price-tag">${course.price} <span class="currency">${course.currency}</span></span>`
          }
          <button class="btn btn-primary btn-small" onclick="openCourse('${course.id}')">${isEnrolled ? "متابعة الدورة" : "التفاصيل والاشتراك"}</button>
        </div>
      `;
      grid.appendChild(card);
    });

    if (list.length === 0) {
      grid.innerHTML = '<p style="text-align:center;color:var(--muted);">لا توجد دورات في هذا التصنيف حالياً.</p>';
    }
  }

  function openCourse(courseId) {
    window.location.href = `course-player.html?course=${encodeURIComponent(courseId)}`;
  }

  function requestTopUp() {
    alert("لشحن رصيد محفظتك، تواصل مع إدارة المنصة عبر واتساب أو زر لوحة المدير (نظام دفع حقيقي يمكن ربطه لاحقاً).");
  }
</script>
</body>
</html>
