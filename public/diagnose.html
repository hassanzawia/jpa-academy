<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>تشخيص المشكلة | JPA</title>
<style>
  body { font-family: monospace; background: #1c2b28; color: #fff; padding: 16px; direction: rtl; font-size: 14px; }
  .line { padding: 8px; margin-bottom: 6px; border-radius: 6px; word-break: break-all; }
  .ok { background: #1f4d3a; color: #7ee8a8; }
  .fail { background: #4d1f1f; color: #ff8a8a; }
  .pending { background: #4d451f; color: #ffe08a; }
  h2 { color: #f2a900; }
</style>
</head>
<body>
<h2>🔍 تشخيص مباشر لهاتفك</h2>
<div id="log"></div>

<script>
  const logEl = document.getElementById("log");
  function log(msg, status) {
    const div = document.createElement("div");
    div.className = "line " + status;
    div.textContent = msg;
    logEl.appendChild(div);
  }

  log("1) بدء الفحص...", "pending");

  // فحص 1: هل يعمل الاتصال بالإنترنت العام؟
  fetch("https://www.google.com/generate_204", { mode: "no-cors" })
    .then(() => log("✅ 2) الاتصال بالإنترنت العام يعمل", "ok"))
    .catch((e) => log("❌ 2) فشل الاتصال بالإنترنت العام: " + e.message, "fail"));

  // فحص 2: تحميل firebase-app-compat.js
  const s1 = document.createElement("script");
  s1.src = "https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js";
  s1.onload = () => log("✅ 3) تحميل firebase-app-compat.js نجح", "ok");
  s1.onerror = () => log("❌ 3) فشل تحميل firebase-app-compat.js (مشكلة في الوصول لـ gstatic.com)", "fail");
  document.head.appendChild(s1);

  // فحص 3: تحميل firebase-auth-compat.js (بعد تأخير بسيط لضمان تحميل app أولاً)
  setTimeout(() => {
    const s2 = document.createElement("script");
    s2.src = "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js";
    s2.onload = () => {
      log("✅ 4) تحميل firebase-auth-compat.js نجح", "ok");
      tryInitAuth();
    };
    s2.onerror = () => log("❌ 4) فشل تحميل firebase-auth-compat.js (هذا هو السبب المحتمل!)", "fail");
    document.head.appendChild(s2);
  }, 1500);

  // فحص 4: تحميل firebase-firestore-compat.js
  setTimeout(() => {
    const s3 = document.createElement("script");
    s3.src = "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js";
    s3.onload = () => log("✅ 5) تحميل firebase-firestore-compat.js نجح", "ok");
    s3.onerror = () => log("❌ 5) فشل تحميل firebase-firestore-compat.js", "fail");
    document.head.appendChild(s3);
  }, 2500);

  // فحص 5: تهيئة Firebase Auth فعلياً
  function tryInitAuth() {
    try {
      if (typeof firebase === "undefined") {
        log("❌ 6) كائن firebase غير معرّف إطلاقاً!", "fail");
        return;
      }
      const firebaseConfig = {
        apiKey: "AIzaSyAhqeuGr5jN69TfyeQnDxRiQ-dQvieNxdg",
        authDomain: "pharmacyacadimy.firebaseapp.com",
        projectId: "pharmacyacadimy",
        storageBucket: "pharmacyacadimy.firebasestorage.app",
        messagingSenderId: "78419011632",
        appId: "1:78419011632:web:1432df05befac9dccfe5f5"
      };
      firebase.initializeApp(firebaseConfig);
      log("✅ 6) firebase.initializeApp() نجح", "ok");

      const auth = firebase.auth();
      log("✅ 7) firebase.auth() نجح - Auth جاهزة!", "ok");

      auth.signInWithEmailAndPassword("dr_sarah@jpa-academy.com", "sarah@2026")
        .then((cred) => {
          log("✅ 8) تسجيل الدخول الفعلي نجح! المستخدم: " + cred.user.email, "ok");
          log("🎉 كل شيء يعمل بنجاح تام - المشكلة على الأرجح كانت في التخزين المؤقت فقط", "ok");
        })
        .catch((err) => {
          log("❌ 8) فشل تسجيل الدخول الفعلي: [" + err.code + "] " + err.message, "fail");
        });
    } catch (e) {
      log("❌ 6) استثناء أثناء تهيئة Firebase: " + e.message, "fail");
    }
  }

  window.onerror = function (msg, url, line, col, error) {
    log("🔴 خطأ JavaScript عام: " + msg + " (السطر: " + line + ")", "fail");
  };
</script>
</body>
</html>
