<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>
  // التقاط أي خطأ يحدث أثناء تحميل الصفحة
  window.onerror = function(message, source, lineno) {
    alert("خطأ أثناء التحميل: " + message + " في السطر: " + lineno);
    return false;
  };

  // التقاط أي فشل في الوعود البرمجية
  window.onunhandledrejection = function(event) {
    alert("خطأ في عملية خلفية: " + event.reason);
  };
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>تسجيل الدخول | Al-Jawda Pharmacy Academy</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0e7c66" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- 🔍 لوحة التشخيص يجب أن تُحمَّل أولاً، قبل أي شيء آخر -->

<header class="header">
  <div class="logo-badge">JPA · Al-Jawda Pharmacy Academy</div>
  <h1>تسجيل الدخول</h1>
  <p class="slogan">بيانات حسابك تُزامن تلقائياً بين الهاتف والويب</p>
</header>

<main class="login-wrap">

  <div class="card">
    <div id="error-box"></div>
    <div class="form-group">
      <label for="email">البريد الإلكتروني</label>
      <input type="email" id="email" placeholder="example@jpa-academy.com" />
    </div>
    <div class="form-group">
      <label for="password">كلمة المرور</label>
      <input type="password" id="password" placeholder="••••••••" />
    </div>
    <button class="btn btn-primary" onclick="handleLogin()">دخول</button>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">حسابات تجريبية (دخول بنقرة واحدة)</h3>
    <p style="color:var(--muted); font-size:0.8rem; margin-top:-6px;">⚠️ ملاحظة: يُسمح بجلسة واحدة نشطة فقط لكل حساب. تسجيل الدخول من جهاز جديد سيُنهي الجلسة على أي جهاز آخر تلقائياً.</p>
    <div class="demo-list" id="demo-accounts"></div>
  </div>

</main>

<nav class="bottom-nav">
  <a href="index.html"><span class="nav-icon">🏠</span>الرئيسية</a>
  <a href="login.html" class="active"><span class="nav-icon">🔑</span>دخول</a>
  <a href="courses.html"><span class="nav-icon">📚</span>الدورات</a>
</nav>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/session-guard.js"></script>
<script src="js/auth.js"></script>
<script>
  dlog("login.html: main script started");
  renderDemoAccounts("demo-accounts");
  dlog("login.html: renderDemoAccounts done");

  let loginInProgress = false;

  function handleLogin() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    if (!email || !password) {
      showError({ message: "الرجاء إدخال البريد الإلكتروني وكلمة المرور" });
      return;
    }
    loginInProgress = true;
    loginWithEmail(email, password).catch((err) => {
      loginInProgress = false;
      showError(err);
    });
  }

  function handleDemoLogin(email, password) {
    dlog(`handleDemoLogin() clicked for: ${email}`);
    document.getElementById("email").value = email;
    document.getElementById("password").value = password;
    loginInProgress = true;
    loginWithEmail(email, password).catch((err) => {
      loginInProgress = false;
      showError(err);
    });
  }

  (function rebindDemoButtons() {
    const container = document.getElementById("demo-accounts");
    if (!container) return;
    DEMO_ACCOUNTS.forEach((acc, index) => {
      const btn = container.children[index];
      if (btn) {
        btn.onclick = () => handleDemoLogin(acc.email, acc.password);
      }
    });
    dlog("login.html: demo buttons rebound");
  })();

  auth.onAuthStateChanged((user) => {
    dlog(`login.html: top-level onAuthStateChanged fired, user=${user ? user.email : "null"}, loginInProgress=${loginInProgress}`);
    if (user && !loginInProgress) {
      dlog("➡️ login.html: redirecting to courses.html (returning user)");
      window.location.href = "courses.html";
    }
  });
</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js").catch(() => {});
}
</script>
</body>
</html>
